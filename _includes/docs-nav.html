{%- assign lang = page.lang | default: site.lang | default: "en" -%}
<nav aria-label="{{ site.data.i18n[lang].documentation }}">
  {% for s in site.data.docs_nav %}{% if s.lang and s.lang != lang %}{% continue %}{% endif %}
  <p class="docs-nav-title">{{ s.title }}</p>
  <ul>
    {% for p in s.pages %}
    <li><a href="{{ p.url | relative_url }}"{% if p.url == page.url %} aria-current="page"{% endif %}>{{ p.title }}</a></li>
    {% endfor %}
  </ul>
  {% endfor %}
</nav>
